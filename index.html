<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Sort It Right | India Recycles</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #eef2ee; --bg2: #e2e9e2; --card: #ffffff;
    --ink: #17211c; --muted: #6b7770; --line: #e0e6e1;
    --green: #1f9d55; --green-d: #16773f; --blue: #1565c0; --red: #d32f2f; --slate: #37474f;
    --shadow: 0 12px 34px rgba(20, 40, 30, 0.10); --shadow-sm: 0 4px 12px rgba(20, 40, 30, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "IBM Plex Sans", "Noto Sans Gujarati", system-ui, sans-serif;
    background: var(--bg2); color: var(--ink);
    display: flex; justify-content: center; min-height: 100dvh; overflow: hidden;
  }
  .gu { font-family: "Noto Sans Gujarati", "IBM Plex Sans", sans-serif; }
  .app { width: 100%; max-width: 480px; min-height: 100dvh; display: flex; flex-direction: column; position: relative; }

  /* Header */
  header { padding: 12px 16px 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; z-index: 5; }
  .logo { height: 24px; width: auto; display: block; background: #fff; padding: 6px 9px; border-radius: 10px; box-shadow: var(--shadow-sm); cursor: pointer; }
  .logo:active { transform: scale(.95); }
  .head-right { display: flex; align-items: center; gap: 8px; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; line-height: 1; height: 32px; display: inline-flex; align-items: center; gap: 4px; font-family: inherit; }
  .icon-btn:active { transform: scale(.95); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 4px 12px 6px; z-index: 5; }
  .stat { background: linear-gradient(180deg,#ffffff,#f4f7f4); border: 1px solid var(--line); border-radius: 13px; padding: 7px 4px 6px; text-align: center; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
  .stat .ico { font-size: 12px; line-height: 1; margin-bottom: 2px; }
  .stat .num { font-size: 18px; font-weight: 800; line-height: 1; }
  .stat .lbl { font-size: 8px; color: var(--muted); font-weight: 700; margin-top: 3px; text-transform: uppercase; letter-spacing: .03em; }
  .stat.streak .num { color: var(--green); }
  .stat .num.pop { animation: numPop .42s ease; }
  @keyframes numPop { 0%,100%{transform:scale(1)} 40%{transform:scale(1.4)} }
  .stat.streak .num.pop { color: #ff7a18; }
  .progress-wrap { padding: 0 16px 2px; z-index: 5; position: relative; }
  .progress-track { height: 8px; background: #d8e0d8; border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--green), #4cc47f); border-radius: 999px; transition: width .3s ease; }
  .prog-label { position: absolute; right: 20px; top: -1px; font-size: 9px; font-weight: 700; color: var(--muted); }

  /* ---------- Play scene (bins at a distance) ---------- */
  .play {
    flex: 1; position: relative; display: flex; flex-direction: column; align-items: center;
    padding: 6px 12px 0; overflow: hidden;
    background: linear-gradient(180deg, #eef3f1 0%, #e9efec 44%, #e9efec 45%, #dfe6e0 46%, #d9e1da 100%);
  }
  /* scene: AMC bins on footpath, zebra-crossing asphalt road in front */
  .scene { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .scene svg { width: 100%; height: 100%; display: block; }

  /* distant bin row */
  .far { width: 100%; display: flex; justify-content: center; align-items: flex-end; gap: 20px; padding-top: 8px; z-index: 2; }

  .bin { flex: 0 0 auto; width: 104px; display: flex; flex-direction: column; align-items: center; cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; transition: transform .12s ease; }
  .bin:active { transform: scale(.96) translateY(2px); }
  .bin:hover .hood { transform: translateY(-2px); }

  /* arched dome hood overhanging the tapered body (AMC style) */
  .hood { position: relative; z-index: 2; width: 96%; height: 30px; border-radius: 50% 50% 7px 7px / 92% 92% 9px 9px; box-shadow: 0 4px 7px rgba(0,0,0,.26); transition: transform .2s ease; overflow: hidden; }
  .hood::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255,255,255,.30), transparent 60%); }
  /* dark arch opening cut into the dome */
  .arch { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 62%; height: 78%; background: radial-gradient(120% 130% at 50% 120%, #223, #0b1410); border-radius: 50% 50% 3px 3px / 100% 100% 4px 4px; box-shadow: inset 0 3px 6px rgba(0,0,0,.7); z-index: 3; }
  /* tall tapered body with AMC label */
  .body { width: 100%; min-height: 174px; margin-top: -4px; color: #fff; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 18px 6px 16px; box-shadow: var(--shadow-sm); clip-path: polygon(8% 0, 92% 0, 84% 100%, 16% 100%); }
  .body::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.30), rgba(0,0,0,0) 20%, rgba(255,255,255,.20) 46%, rgba(0,0,0,0) 74%, rgba(0,0,0,.32)); }
  .body::after { content: ""; position: absolute; top: 0; left: 12%; width: 16%; height: 100%; pointer-events: none; background: linear-gradient(90deg, rgba(255,255,255,.34), rgba(255,255,255,0)); filter: blur(1px); }
  .l1 { font-size: 8px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; opacity: .96; z-index: 1; text-align: center; line-height: 1.15; }
  .l2 { font-size: 23px; font-weight: 800; letter-spacing: .04em; z-index: 1; line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,.32); }
  .l3 { font-size: 10px; font-weight: 700; z-index: 1; margin-top: 2px; }
  .swan { width: 17px; height: 17px; margin-top: 5px; fill: #fff; opacity: .82; z-index: 1; }
  .legs { position: relative; width: 94%; height: 26px; margin-top: -11px; z-index: 0; }
  .legs::before { content: ""; position: absolute; top: 4px; left: 6%; right: 6%; height: 3px; background: #4a3d2c; border-radius: 2px; }
  .legs::after  { content: ""; position: absolute; bottom: 2px; left: 14%; right: 14%; height: 3px; background: #4a3d2c; border-radius: 2px; }
  .legs i { position: absolute; bottom: 2px; width: 4px; height: 24px; background: linear-gradient(90deg, #6a5842, #3a2f22); border-radius: 1px; }
  .legs i:nth-child(1){ left: 14%; transform: rotate(9deg); }
  .legs i:nth-child(2){ left: 33%; transform: rotate(3deg); }
  .legs i:nth-child(3){ right: 33%; transform: rotate(-3deg); }
  .legs i:nth-child(4){ right: 14%; transform: rotate(-9deg); }
  .bshadow { width: 86%; height: 12px; margin-top: 3px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0,0,0,.34), transparent 70%); }

  .bin.green .hood { background: #2c8b3e; } .bin.green .body { background: linear-gradient(180deg, #47a94f, #2f8a3e); }
  .bin.blue  .hood { background: #1c39a0; } .bin.blue  .body { background: linear-gradient(180deg, #2f4fd0, #1e39a8); }
  .bin.red   .hood { background: #c62f2f; } .bin.red   .body { background: linear-gradient(180deg, #e84a4a, #c22626); }
  .bin.slate .hood { background: #40525c; } .bin.slate .body { background: linear-gradient(180deg, #5c7783, #384850); }

  /* mini bins for the start-screen picker */
  .mini-bin { width: 42px; display: flex; flex-direction: column; align-items: center; }
  .mini-hood { position: relative; width: 98%; height: 14px; border-radius: 60% 60% 4px 4px / 96% 96% 4px 4px; overflow: hidden; }
  .mini-arch { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 40%; height: 9px; background: #0c160f; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
  .mini-body { width: 100%; height: 36px; margin-top: -2px; border-radius: 5px 5px 7px 7px; }
  .mini-bin.green .mini-hood{background:#2c8b3e} .mini-bin.green .mini-body{background:linear-gradient(180deg,#47a94f,#2f8a3e)}
  .mini-bin.blue  .mini-hood{background:#1c39a0} .mini-bin.blue  .mini-body{background:linear-gradient(180deg,#2f4fd0,#1e39a8)}
  .mini-bin.red   .mini-hood{background:#c62f2f} .mini-bin.red   .mini-body{background:linear-gradient(180deg,#e84a4a,#c22626)}
  .mini-bin.slate .mini-hood{background:#40525c} .mini-bin.slate .mini-body{background:linear-gradient(180deg,#5c7783,#384850)}

  .bin.gulp .body { animation: gulp .5s ease; }
  @keyframes gulp { 0%,100%{transform:translateY(0) scaleX(1)} 30%{transform:translateY(-7px) scaleX(1.05)} 60%{transform:translateY(0) scaleX(.96)} }
  .bin.gulp .hood { animation: swallow .45s ease; }
  @keyframes swallow { 0%,100%{transform:scaleY(1)} 45%{transform:scaleY(.82) translateY(3px)} }
  .bin.hint { animation: hintPulse 1s ease infinite; }
  .bin.hint .hood, .bin.hint .body { outline: 3px solid rgba(255,255,255,.92); outline-offset: 1px; }
  @keyframes hintPulse { 0%,100%{filter:drop-shadow(0 0 0 rgba(211,47,47,0))} 50%{filter:drop-shadow(0 0 11px rgba(211,47,47,.6))} }

  /* prompt */
  .prompt { margin-top: 10px; font-size: 12.5px; color: #fff; font-weight: 700; text-align: center; z-index: 4; background: rgba(0,0,0,.34); padding: 6px 15px; border-radius: 999px; box-shadow: var(--shadow-sm); }

  /* toast */
  .toast { position: absolute; top: 46%; left: 50%; transform: translate(-50%,-50%) scale(.9); padding: 9px 18px; border-radius: 999px; font-size: 16px; font-weight: 700; color: #fff; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; box-shadow: var(--shadow); z-index: 40; }
  .toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .toast.good { background: var(--green); }

  /* ---------- Thrower (bottom center) ---------- */
  .thrower { margin-top: auto; position: relative; display: flex; flex-direction: column; align-items: center; padding-bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 3; }
  .held { position: relative; display: flex; flex-direction: column; align-items: center; animation: bob 2.8s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .held .bubble { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 13px 18px 11px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 148px; position: relative; z-index: 2; }
  .held .bubble::after { content: ""; position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%) rotate(45deg); width: 18px; height: 18px; background: var(--card); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .held .h-emoji { font-size: 58px; line-height: 1; filter: drop-shadow(0 6px 8px rgba(0,0,0,.14)); }
  .held .h-gu { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .held .h-en { font-size: 12px; color: var(--muted); font-weight: 500; }
  .hand-emoji { font-size: 86px; line-height: 1; margin-top: -12px; filter: drop-shadow(0 8px 10px rgba(0,0,0,.16)); z-index: 1; will-change: transform; animation: handIdle 3.2s ease-in-out infinite; }
  .hand-real { width: 172px; height: auto; margin-top: -6px; z-index: 1; filter: drop-shadow(0 10px 12px rgba(0,0,0,.28)); will-change: transform; animation: handIdle 3.2s ease-in-out infinite; }
  @keyframes handIdle { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-6px) rotate(-5deg)} }
  .hand-shadow { width: 90px; height: 12px; margin-top: -4px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0,0,0,.18), transparent 70%); }

  .held.hidden-item .bubble { opacity: 0; transform: scale(.5) translateY(8px); transition: opacity .12s, transform .12s; }
  .held.enter .bubble { animation: pop .4s cubic-bezier(.2,.9,.3,1.5); }
  @keyframes pop { 0%{transform:scale(.35) rotate(-8deg); opacity:0} 60%{transform:scale(1.08) rotate(2deg)} 100%{transform:scale(1) rotate(0); opacity:1} }

  /* projectile + depth cues */
  .projectile { position: fixed; font-size: 54px; z-index: 50; pointer-events: none; will-change: transform, left, top; filter: drop-shadow(0 6px 8px rgba(0,0,0,.2)); }
  .proj-shadow { position: fixed; width: 46px; height: 14px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0,0,0,.28), transparent 72%); z-index: 1; pointer-events: none; will-change: transform, left, top; }
  .ghost { position: fixed; z-index: 48; pointer-events: none; opacity: .32; filter: blur(1px); animation: ghostFade .28s ease-out forwards; }
  @keyframes ghostFade { to { opacity: 0; } }
  .puff { position: fixed; width: 30px; height: 12px; border-radius: 50%; background: rgba(180,190,180,.65); transform: translate(-50%,-50%); z-index: 3; pointer-events: none; animation: puff .45s ease-out forwards; }
  @keyframes puff { 0%{opacity:.7; transform:translate(-50%,-50%) scale(.4)} 100%{opacity:0; transform:translate(-50%,-50%) scale(1.9)} }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; z-index: 60; pointer-events: none; animation: confPop .75s ease-out forwards; }
  @keyframes confPop { 0%{transform:translate(0,0) scale(1) rotate(0); opacity:1} 100%{transform:translate(var(--tx),var(--ty)) scale(.3) rotate(220deg); opacity:0} }

  /* ---------- Error card ---------- */
  .error-card { position: absolute; left: 12px; right: 12px; top: 8px; z-index: 20; background: #fff5f5; border: 2px solid var(--red); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; text-align: left; display: none; animation: errIn .28s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes errIn { 0%{opacity:0; transform:translateY(-10px) scale(.96)} 100%{opacity:1; transform:none} }
  .error-card.show { display: block; }
  .error-card .err-top { display: flex; align-items: center; gap: 10px; }
  .error-card .err-emoji { font-size: 34px; line-height: 1; }
  .error-card .err-x { color: var(--red); font-weight: 700; font-size: 13px; letter-spacing: .02em; text-transform: uppercase; }
  .error-card .err-line { font-size: 15px; font-weight: 600; margin-top: 2px; line-height: 1.35; }
  .error-card .chip { display: inline-flex; align-items: center; gap: 5px; color: #fff; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; vertical-align: middle; }
  .chip.wet{background:var(--green-d)} .chip.dry{background:var(--blue)} .chip.hazard{background:var(--red)} .chip.ewaste{background:var(--slate)}
  .error-card .err-why { font-size: 13px; color: #7a4a4a; margin-top: 8px; line-height: 1.5; }
  .error-card .err-why .en { color: var(--muted); }
  .error-card .gotit { margin-top: 12px; width: 100%; background: var(--red); color: #fff; border: none; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .error-card .gotit:active { transform: translateY(1px); }

  /* ---------- Overlays ---------- */
  .overlay { position: absolute; inset: 0; background: rgba(238, 242, 238, .97); backdrop-filter: blur(5px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 26px; z-index: 30; gap: 4px; overflow-y: auto; }
  .overlay.hidden { display: none; }
  .overlay .o-logo { height: 38px; margin-bottom: 12px; background: #fff; padding: 11px 15px; border-radius: 16px; box-shadow: var(--shadow-sm); }
  .overlay h2 { font-size: 26px; font-weight: 700; }
  .overlay .sub { font-size: 13.5px; color: var(--muted); max-width: 320px; line-height: 1.5; margin-top: 3px; }
  .overlay .final-score { font-size: 46px; font-weight: 700; color: var(--green); margin: 2px 0; }

  /* bin picker */
  .picker { margin-top: 16px; width: 100%; max-width: 340px; }
  .picker-title { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
  .picker-title .gu { display: block; color: var(--muted); font-weight: 500; font-size: 11px; }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .chip-sel { position: relative; border: 2px solid var(--line); border-radius: 16px; padding: 10px 8px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; background: #fff; width: 74px; opacity: .55; transition: .15s; }
  .chip-sel.on { opacity: 1; box-shadow: var(--shadow-sm); }
  .chip-sel.on.wet { border-color: var(--green); } .chip-sel.on.dry { border-color: var(--blue); }
  .chip-sel.on.hazard { border-color: var(--red); } .chip-sel.on.ewaste { border-color: var(--slate); }
  .chip-sel .ci { font-size: 22px; line-height: 1; }
  .chip-sel .cl { font-size: 11px; font-weight: 700; }
  .chip-sel .cl2 { font-size: 8.5px; color: var(--muted); font-weight: 500; }
  .chip-sel .tick { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%; background: var(--green); color: #fff; font-size: 12px; display: none; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
  .chip-sel.on .tick { display: flex; }
  .picker-hint { font-size: 11px; color: var(--muted); margin-top: 8px; min-height: 14px; }

  .btn { margin-top: 16px; background: var(--green); color: #fff; border: none; padding: 14px 44px; border-radius: 999px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(31,157,85,.34); font-family: inherit; }
  .btn:active { transform: translateY(2px); }
  .btn:disabled { opacity: .5; box-shadow: none; }
  .rules { margin-top: 14px; display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .rules div { display: flex; align-items: center; gap: 5px; }
  .rules b { color: var(--ink); }
  .credit { margin-top: 16px; font-size: 11px; color: var(--muted); }

  /* ---------- Image-based home page ---------- */
  .overlay.home { padding: 0; background: #e9ece9; justify-content: center; align-items: center; overflow: hidden; }
  .home-wrap { position: relative; display: block; }
  .home-bg { display: block; height: 100dvh; width: auto; max-width: 100vw; }
  .hz { position: absolute; background: transparent; border: none; cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; }
  .hz .bicon { position: absolute; left: 50%; top: 41%; transform: translate(-50%,-50%); width: 36%; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .hz .bicon svg { width: 100%; height: auto; display: block; }
  .hz .bcheck { position: absolute; left: 50%; top: 16%; transform: translate(-50%,-50%); width: 50%; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .hz .bcheck svg { width: 100%; height: auto; display: block; }
  .hz.off .bcheck { display: none; }
  .hz.off::before { content: ""; position: absolute; inset: 2%; background: rgba(20,22,20,.42); border-radius: 14px; }
  .count-pill { position: absolute; left: 50%; top: 63.3%; transform: translateX(-50%); background: #fff; color: #2a2a2a; font-size: 13px; font-weight: 800; letter-spacing: .03em; padding: 9px 24px; border-radius: 11px; box-shadow: 0 3px 9px rgba(0,0,0,.18); white-space: nowrap; }
  .start-hz { position: absolute; background: transparent; border: none; cursor: pointer; padding: 0; border-radius: 50% / 45%; -webkit-tap-highlight-color: transparent; transition: transform .1s ease; }
  .start-hz:active { transform: scale(.96); }
  .start-hz:disabled { cursor: default; }

  /* ---------- Result screen ---------- */
  .result-scroll { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .badge-icon { font-size: 66px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); animation: pop .5s cubic-bezier(.2,.9,.3,1.5); }
  .badge-name { font-size: 26px; font-weight: 800; margin-top: 6px; }
  .badge-sub { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin-top: 6px; max-width: 320px; }
  .result-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin: 18px 0 6px; }
  .rstat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; box-shadow: var(--shadow-sm); }
  .rstat .rn { font-size: 24px; font-weight: 800; color: var(--green); line-height: 1; }
  .rstat .rl { font-size: 9px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
  .impact { width: 100%; background: linear-gradient(180deg,#f1f8f2,#e8f3ea); border: 1px solid #cfe6d4; border-radius: 16px; padding: 14px 16px; margin: 12px 0 2px; text-align: left; }
  .impact .imp-h { font-size: 12px; font-weight: 800; color: var(--green-d); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 10px; text-align: center; }
  .impact .imp-row { display: flex; align-items: center; gap: 10px; margin: 9px 0; }
  .impact .imp-ico { font-size: 22px; width: 26px; text-align: center; }
  .impact .imp-num { font-size: 17px; font-weight: 800; color: var(--ink); }
  .impact .imp-txt { font-size: 11.5px; color: var(--muted); line-height: 1.25; }
</style>
</head>
<body>
<div class="app">

  <header>
    <img class="logo" id="homeLogo" src="assets/india-recycles-logo.png" alt="India Recycles — back to home" title="Home" />
    <div class="head-right">
      <button class="icon-btn" id="soundBtn" title="Sound">🔊</button>

  // ---------- Sound ----------
  let actx;
  function AC(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function beep(freq, at, dur, type="sine", vol=0.22){
    const c=AC(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at+dur); o.start(at); o.stop(at+dur+0.02);
  }
  function playCorrect(){ if(muted)return; const t=AC().currentTime; beep(523.25,t,0.12); beep(659.25,t+0.09,0.12); beep(783.99,t+0.18,0.22); }
  function playThrow(){ if(muted)return; const c=AC(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type="sine"; o.frequency.setValueAtTime(680,t); o.frequency.exponentialRampToValueAtTime(230,t+0.28);
    g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.13,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.32); }
  function playWrong(){ if(muted)return; const t=AC().currentTime; beep(196,t,0.16,"square",0.16); beep(155.56,t+0.14,0.24,"square",0.16); }

  // ---------- Helpers ----------
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
  function bumpStat(el){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  function confetti(x, y){
    const colors=["#2ab069","#2f8fe0","#ef5350","#ffca28","#ab47bc","#26c6da"];
    for(let i=0;i<16;i++){
      const p=document.createElement("div"); p.className="confetti";
      p.style.left=x+"px"; p.style.top=y+"px"; p.style.background=colors[i%colors.length];
      const ang=Math.random()*Math.PI*2, dist=40+Math.random()*70;
      p.style.setProperty("--tx", Math.cos(ang)*dist+"px");
      p.style.setProperty("--ty", (Math.sin(ang)*dist-45)+"px");
      document.body.appendChild(p); setTimeout(()=>p.remove(), 780);
    }
  }

  // ---------- Throw (from bottom center, into a distant bin) ----------
  function ghost(emoji, x, y, s){
    const g=document.createElement("div"); g.className="ghost"; g.textContent=emoji;
    g.style.left=x+"px"; g.style.top=y+"px"; g.style.fontSize="54px";
    g.style.transform="translate(-50%,-50%) scale("+s+")";

  function puff(x,y){ const d=document.createElement("div"); d.className="puff"; d.style.left=x+"px"; d.style.top=y+"px"; document.body.appendChild(d); setTimeout(()=>d.remove(),460); }

  function throwTo(binEl, emoji, onDone){
    const style = THROW_STYLES[Math.floor(Math.random()*THROW_STYLES.length)];
    const startRect = held.querySelector(".bubble").getBoundingClientRect();
    const hood = binEl.querySelector(".hood").getBoundingClientRect();
    const baseR = binEl.querySelector(".bshadow").getBoundingClientRect();
    const handRect = handEl.getBoundingClientRect();
    const x0 = startRect.left + startRect.width/2, y0 = startRect.top + startRect.height/2;
    const x1 = hood.left + hood.width/2,           y1 = hood.top + hood.height*0.35;
    const groundY0 = handRect.bottom + 6;          // shadow starts near the hand (close)
    const groundY1 = baseR.top + baseR.height/2;   // shadow ends at the bin base (far)

    // animated hand swing toward the bin (direction-aware)
    const handCx = handRect.left + handRect.width/2;
    const dir = x1 - handCx;
    const dx = Math.max(-46, Math.min(46, dir*0.12));
    const lean = Math.max(-26, Math.min(26, dir*0.05)) * style.handR;
    // pronounced throwing motion: quick wind-up dip, then swing up toward the bin
    handEl.style.animation = "none";
    handEl.style.transition = "transform .1s ease-out";
    handEl.style.transform = "translateY(14px) rotate("+(lean*-0.4)+"deg) scale(.97)";
    setTimeout(()=>{
      handEl.style.transition = "transform .16s cubic-bezier(.25,.8,.3,1.7)";
      handEl.style.transform = "translate("+(dx*1.5)+"px,"+(style.handY*1.35)+"px) rotate("+lean+"deg) scale(1.07)";
    }, 90);

    const proj = document.createElement("div");
    proj.className="projectile"; proj.textContent=emoji; document.body.appendChild(proj);
    const shadow = document.createElement("div");
    shadow.className="proj-shadow"; document.body.appendChild(shadow);
    const dur = style.dur;
    const peak = (Math.max(150, (y0-y1)*0.5 + 120)) * style.peak;
    held.classList.add("hidden-item");
    playThrow();
    let lastGhost=0;
    const t0=performance.now();
    function frame(now){
      let t=Math.min(1,(now-t0)/dur);
      const x = x0 + (x1-x0)*t + style.curve*Math.sin(Math.PI*t);
      const y = y0 + (y1-y0)*t - peak*Math.sin(Math.PI*t);
      const s = 1 - 0.82*t;                 // shrink hard into the distance
      proj.style.left=x+"px"; proj.style.top=y+"px";
      proj.style.transform="translate(-50%,-50%) scale("+s+") rotate("+(t*style.spin)+"deg)";
      // ground shadow glides across the floor from near -> far, shrinking
      const gx = x0 + (x1-x0)*t + style.curve*Math.sin(Math.PI*t)*0.4;
      const gy = groundY0 + (groundY1-groundY0)*t;
      shadow.style.left=gx+"px"; shadow.style.top=gy+"px";
      shadow.style.transform="translate(-50%,-50%) scale("+(1-0.72*t)+")";
      shadow.style.opacity = (0.5 - 0.2*t);
      // motion trail
      if(now-lastGhost>42){ lastGhost=now; ghost(emoji,x,y,s); }
      if(t<1) requestAnimationFrame(frame);
      else {
        proj.remove(); shadow.remove();
        puff(x1, groundY1); confetti(x1, y1);
        handEl.style.transition = "transform .32s ease"; handEl.style.transform = "";
        setTimeout(()=>{ handEl.style.transition=""; handEl.style.animation=""; }, 330);
        onDone();
      }
    }
    requestAnimationFrame(frame);
  }

  function pickBin(chosen, binEl){
    if(locked) return;
    const it = queue[index];
    if(it.bin === chosen){
      locked=true;
      const bonus = streak>=2 ? 5 : 0, gained = 10+bonus;
      throwTo(binEl, it.emoji, ()=>{
        score += gained; streak += 1; if(streak>maxStreak) maxStreak=streak;
        if(!itemWrong) firstTryCorrect += 1;
        correctByCat[it.bin] = (correctByCat[it.bin]||0) + 1;
        scoreEl.textContent=score; streakEl.textContent=streak;
        bumpStat(scoreEl); bumpStat(streakEl);
        binEl.classList.add("gulp"); playCorrect();
        flashToast(bonus ? ("+"+gained+" 🔥") : "+10 ✓");
        setTimeout(()=>{ binEl.classList.remove("gulp"); index+=1; updateAcc(); if(index>=queue.length) endGame(); else showItem(); }, 520);
      });
    } else {
      locked=true; itemWrong=true;
      score = Math.max(0, score-5); streak=0;
      scoreEl.textContent=score; streakEl.textContent=streak;
      playWrong(); showError(it);
    }
  }

  function showError(it){
    const right = BINS[it.bin];
    errEmoji.textContent = it.emoji;
    $("errX").textContent = (lang==="gu") ? "ખોટો ડબ્બો" : "Wrong bin";
    const goesGu = "<span class='gu'>"+it.gu+" → </span><span class='chip "+it.bin+"'>"+right.gu+"</span>";
    const goesEn = it.en+" → <span class='chip "+it.bin+"'>"+right.en+"</span>";
    if(lang==="gu") errLine.innerHTML = goesGu;
    else if(lang==="en") errLine.innerHTML = goesEn;
    else errLine.innerHTML = goesGu + "<br><span style='font-size:13px;color:var(--muted)'>"+goesEn+"</span>";
    if(lang==="gu") errWhy.innerHTML = "<span class='gu'>"+right.whyGu+"</span>";
    else if(lang==="en") errWhy.innerHTML = right.whyEn;
    else errWhy.innerHTML = "<span class='gu'>"+right.whyGu+"</span><br><span class='en'>"+right.whyEn+"</span>";
    errorCard.classList.add("show");
    const cb = binsWrap.querySelector('.bin[data-bin="'+it.bin+'"]'); if(cb) cb.classList.add("hint");
  }
  function hideError(){ errorCard.classList.remove("show"); binsWrap.querySelectorAll(".bin").forEach(b=>b.classList.remove("hint")); }

  function nextItem(){ index += 1; if(index >= queue.length) endGame(); else showItem(); }

  // score-based badge ladder
  const BADGES = [
    { min:100, icon:"🏆", en:"Society Leader",  gu:"સોસાયટી લીડર",
      gEn:"Flawless! You sorted every item right the first time. You're ready to lead your society's waste drive.",
      gGu:"પરફેક્ટ! દરેક કચરો પહેલી વારમાં જ સાચો. તમે તમારી સોસાયટીની સ્વચ્છતા મુહિમ દોરી શકો છો." },
    { min:90,  icon:"🌟", en:"Aware Citizen",   gu:"જાગૃત નાગરિક",
      gEn:"Excellent! You know your bins. Share this with your neighbours and lift the whole street.",
      gGu:"ઉત્તમ! તમને ડબ્બા બરાબર આવડે છે. પડોશીઓ સાથે શેર કરો અને આખી શેરી જાગૃત કરો." },
    { min:75,  icon:"♻️", en:"Green Warrior",   gu:"ગ્રીન વોરિયર",
      gEn:"Great going! A little more practice on the tricky items and you'll be perfect.",
      gGu:"સરસ! થોડા અઘરા કચરા પર પ્રેક્ટિસ કરો, પછી તમે પરફેક્ટ થઈ જશો." },
    { min:50,  icon:"🌱", en:"Eco Learner",     gu:"ઈકો લર્નર",
      gEn:"Good start! Remember: wet = kitchen/garden, dry = paper/plastic/metal/glass. Try again!",
      gGu:"સારી શરૂઆત! યાદ રાખો: ભીનો = રસોડું/બગીચો, સૂકો = કાગળ/પ્લાસ્ટિક/ધાતુ/કાચ. ફરી પ્રયત્ન કરો!" },
    { min:0,   icon:"🐣", en:"Beginner",        gu:"શરૂઆતી",
      gEn:"Every leader starts here. Read the tips on wrong answers and play again to level up.",
      gGu:"દરેક લીડરની શરૂઆત અહીંથી. ખોટા જવાબ પરની ટિપ્સ વાંચો અને ફરી રમીને આગળ વધો." },
  ];

  function endGame(){
    if(score>best){ best=score; localStorage.setItem("sortItRightBest",best); }
    const accPct = Math.round(firstTryCorrect/roundLen*100);
    const badge = BADGES.find(b=>accPct>=b.min) || BADGES[BADGES.length-1];

    bestEl.textContent=best; progress.style.width="100%";
    $("finalScore").textContent=score;
    $("finalAcc").textContent=accPct+"%";
    $("finalBest").textContent=best;
    $("endIcon").textContent=badge.icon;
    $("badgeName").textContent = (lang==="gu") ? badge.gu : badge.en + (lang==="both" ? " · "+badge.gu : "");
    $("badgeName").className = "badge-name gu";
    if(lang==="gu") $("badgeSub").innerHTML = "<span class='gu'>"+badge.gGu+"</span>";
    else if(lang==="en") $("badgeSub").innerHTML = badge.gEn;
    else $("badgeSub").innerHTML = "<span class='gu'>"+badge.gGu+"</span><br>"+badge.gEn;

    // Waste-impact if you bifurcate correctly (scaled by accuracy, projected over a year of daily sorting)
    const a = firstTryCorrect/roundLen;
    const compost = Math.round(180*a), recycled = Math.round(120*a), co2 = Math.round(240*a);
    const H = (lang==="gu") ? "તમારા યોગ્ય વર્ગીકરણની અસર (વર્ષે)" : "Impact of your correct sorting (per year)";
    const t1 = (lang==="gu") ? "ભીનો કચરો ખાતરમાં ફેરવાય" : "wet waste turned into compost";
    const t2 = (lang==="gu") ? "સૂકો કચરો રિસાયકલ થાય" : "dry waste recycled, not dumped";
    const t3 = (lang==="gu") ? "CO₂ ઉત્સર્જન બચે" : "CO₂ emissions saved";
    $("impact").innerHTML =
      "<div class='imp-h'>"+H+"</div>"+
      "<div class='imp-row'><span class='imp-ico'>🌱</span><div><span class='imp-num'>~"+compost+" kg</span><div class='imp-txt'>"+t1+"</div></div></div>"+
      "<div class='imp-row'><span class='imp-ico'>♻️</span><div><span class='imp-num'>~"+recycled+" kg</span><div class='imp-txt'>"+t2+"</div></div></div>"+
      "<div class='imp-row'><span class='imp-ico'>💨</span><div><span class='imp-num'>~"+co2+" kg</span><div class='imp-txt'>"+t3+"</div></div></div>";
    $("endOverlay").classList.remove("hidden");
  }

  // ---------- Language ----------
  function applyBinLang(){
    binsWrap.querySelectorAll(".l1").forEach(e=> e.style.display=(lang==="gu")?"none":"");
    binsWrap.querySelectorAll(".l3").forEach(e=> e.style.display=(lang==="en")?"none":"");
  }
  function applyLang(){
    document.querySelectorAll("[data-en]").forEach(el=>{
      const en=el.getAttribute("data-en"), gu=el.getAttribute("data-gu");
      el.textContent = (lang==="gu") ? gu : en;
    });
    itemGu.style.display = (lang==="en") ? "none" : "";
    itemEn.style.display = (lang==="gu") ? "none" : "";
    $("langBtn").textContent = lang==="both" ? "EN / ગુ" : lang==="en" ? "English" : "ગુજરાતી";
    applyBinLang(); renderHome();
  }

  // ---------- Events ----------
  $("gotitBtn").addEventListener("click", ()=>{ hideError(); locked=false; });
  $("startBtn").addEventListener("click", startGame);
  $("playAgain").addEventListener("click", ()=>{ $("endOverlay").classList.add("hidden"); $("startOverlay").classList.remove("hidden"); renderHome(); });
  document.querySelectorAll("#startOverlay .hz").forEach(z=> z.addEventListener("click", ()=> toggleBin(z.dataset.bin)));
  $("homeLogo").addEventListener("click", ()=>{ locked=false; hideError(); $("endOverlay").classList.add("hidden"); $("startOverlay").classList.remove("hidden"); renderHome(); });
  $("langBtn").addEventListener("click", ()=>{
    lang = lang==="both" ? "en" : lang==="en" ? "gu" : "both";
    localStorage.setItem("sortItRightLang", lang); applyLang();
  });
  $("soundBtn").addEventListener("click", ()=>{
    muted=!muted; localStorage.setItem("sortItRightMuted", muted?"1":"0");
    $("soundBtn").textContent = muted ? "🔇" : "🔊";
    if(!muted){ try{AC().resume();}catch(e){} }
  });

  renderHome();
  applyLang();
</script>
</body>
</html>
